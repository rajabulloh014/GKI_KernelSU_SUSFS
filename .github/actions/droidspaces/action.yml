name: 'Apply DroidSpaces-OSS patches'
description: 'Clone and apply Droidspaces-OSS patches based on kernel version'
inputs:
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true
  android_version:
    description: 'Android version (e.g., android15)'
    required: true
runs:
  using: "composite"
  steps:
    - name: Download and apply Droidspaces-OSS patches
      shell: bash
      run: |
        set -e
        cd ${{ github.workspace }}/${{ env.KERNEL_ROOT }}/common
        echo "Cloning Droidspaces-OSS..."
        git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git /tmp/Droidspaces-OSS
        KVER="${{ inputs.kernel_version }}"
        echo "Applying DroidSpaces patches for kernel $KVER"
        case "$KVER" in
          "6.12")
            cp /tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/kernel-6.12/001.GKI-6.12-or-above-fix_sysvipc_kabi.patch .
            patch -p1 < 001.GKI-6.12-or-above-fix_sysvipc_kabi.patch
            ;;
          "6.6"|"6.1")
            cp /tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch .
            patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
            ;;
          "5.15")
            cp /tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch .
            patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
            ;;
          "5.10")
            cp /tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch .
            patch -p1 < 001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch
            cp /tmp/Droidspaces-OSS/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch .
            patch -p1 < 002.5.10_or_lower_use_android_abi_padding_for_posix_mqueue.patch
            ;;
          *)
            echo "Unsupported kernel version $KVER for DroidSpaces, skipping patches."
            ;;
        esac
        # Enable required kernel config options
        echo "Enabling DroidSpaces kernel configs..."
        CONFIG_FILE="${{ github.workspace }}/${{ env.KERNEL_ROOT }}/common/arch/arm64/configs/gki_defconfig"
        echo "CONFIG_SYSVIPC=y" >> "$CONFIG_FILE"
        echo "CONFIG_POSIX_MQUEUE=y" >> "$CONFIG_FILE"
        echo "CONFIG_NAMESPACES=y" >> "$CONFIG_FILE"
        echo "DroidSpaces patch applied successfully."
