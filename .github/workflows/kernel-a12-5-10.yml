name: 内核构建 - Android 12 (5.10)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          - Next
          - MKSU
          - SukiSU
          - ReSukiSU
        default: SukiSU
      kernelsu_branch:
        description: "KSU 分支"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Stable(标准)
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      build_user:
        description: "自定义编译用户 (默认为 build-user)"
        required: false
        type: string
        default: "FUCK-YOU"
      build_host:
        description: "自定义编译主机 (默认为 build-host)"
        required: false
        type: string
        default: "NETANYAHU"
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: true
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: true
      use_kpm:
        description: "启用 KPM 功能"
        required: true
        type: boolean
        default: true
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
      tickRate:
        description: "Kernel tick rate (Hz)"
        required: false
        type: choice
        default: "250"
        options:
          - "default"
          - "100"
          - "250"
          - "300"
          - "500"
          - "600"
          - "750"
          - "1000"
      optimizationLevel:
        description: "Compiler optimization level"
        required: false
        type: choice
        default: "O2"
        options:
          - "O2"
          - "O3"
          - "Os"
      better_net:
        description: "启用网络功能拓展 (ipset, iptables, IPv6 NAT)"
        type: boolean
        default: false
      adios_enable:
        description: "启用 ADIOS IO 调度器 (提升 IO 性能)"
        type: boolean
        default: true
      use_droidspaces:
        description: "Enable DroidSpaces (Linux Container support)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      kernelsu_branch:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      build_user:
        required: false
        type: string
        default: "FUCK-YOU"
      build_host:
        required: false
        type: string
        default: "NETANYAHU"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: boolean
      use_rekernel:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
      tickRate:
        required: false
        type: string
        default: "250"
      optimizationLevel:
        required: false
        type: string
        default: "O2"
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      better_net:
        description: "启用网络功能拓展 (ipset, iptables, IPv6 NAT)"
        type: boolean
        default: false
      adios_enable:
        description: "启用 ADIOS IO 调度器 (提升 IO 性能)"
        type: boolean
        default: true
      use_droidspaces:
        description: "Enable DroidSpaces (Linux Container support)"
        type: boolean
        default: false

jobs:
  build-kernels-a12-5-10:
    name: "5.10.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "66"
            os_patch_level: "2022-01"
            revision: "r11"
          - sub_level: "81"
            os_patch_level: "2022-03"
            revision: "r11"
          - sub_level: "101"
            os_patch_level: "2022-04"
            revision: "r28"
          - sub_level: "110"
            os_patch_level: "2022-07"
            revision: "r1"
          - sub_level: "117"
            os_patch_level: "2022-09"
            revision: "r1"
          - sub_level: "136"
            os_patch_level: "2022-11"
            revision: "r15"
          - sub_level: "149"
            os_patch_level: "2023-01"
            revision: "r1"
          - sub_level: "160"
            os_patch_level: "2023-03"
            revision: "r1"
          - sub_level: "168"
            os_patch_level: "2023-04"
            revision: "r9"
          - sub_level: "177"
            os_patch_level: "2023-07"
            revision: "r3"
          - sub_level: "185"
            os_patch_level: "2023-09"
            revision: "r1"
          - sub_level: "198"
            os_patch_level: "2024-01"
            revision: "r17"
          - sub_level: "205"
            os_patch_level: "2024-03"
            revision: "r1"
          - sub_level: "209"
            os_patch_level: "2024-05"
            revision: "r13"
          - sub_level: "218"
            os_patch_level: "2024-08"
            revision: "r14"
          - sub_level: "226"
            os_patch_level: "2024-11"
            revision: "r8"
          - sub_level: "233"
            os_patch_level: "2025-02"
            revision: "r1"
          - sub_level: "236"
            os_patch_level: "2025-05"
            revision: "r1"
          - sub_level: "237"
            os_patch_level: "2025-06"
            revision: "r1"
          - sub_level: "240"
            os_patch_level: "2025-09"
            revision: "r1"
          - sub_level: "246"
            os_patch_level: "2025-12"
            revision: "r1"
          - sub_level: "X"
            os_patch_level: "lts"
            revision: "r1"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      revision: ${{ matrix.revision }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      build_user: ${{ inputs.build_user }}
      build_host: ${{ inputs.build_host }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      supp_op: false
      enable_susfs: ${{ !inputs.cancel_susfs }}
      tick_rate: ${{ inputs.tickRate }}
      optimization_level: ${{ inputs.optimizationLevel }}
      better_net: ${{ inputs.better_net }}
      adios_enable: ${{ inputs.adios_enable }}
      use_droidspaces: ${{ inputs.use_droidspaces }}

  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
